name: USBC-Liste durchsuchen (Diagnose)

on:
  workflow_dispatch:
    inputs:
      suche:
        description: 'Suchbegriff, z. B. Venom Shock'
        required: true
        default: 'Venom Shock'

permissions:
  contents: read

jobs:
  suche:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: USBC-Liste laden und durchsuchen
        env:
          SUCHE: ${{ inputs.suche }}
        run: |
          UA="Mozilla/5.0"
          URL=$(curl -sL -A "$UA" https://bowl.com/approvedballlist | grep -oE '(https://bowl\.com)?/getmedia/[A-Za-z0-9-]+/approved_balllist_CURRENT\.pdf' | head -1 || true)
          [ -z "$URL" ] && URL=/getmedia/8b570e80-761c-4486-8628-9d50d718dd60/approved_balllist_CURRENT.pdf
          case "$URL" in /*) URL="https://bowl.com$URL";; esac
          echo "Lade $URL"
          curl -fsSL -A "$UA" -o usbc.pdf "$URL"
          pdftotext -layout usbc.pdf usbc.txt
          node scripts/usbc-suche.js usbc.txt "$SUCHE"
