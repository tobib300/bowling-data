name: Ballliste aktualisieren

on:
  schedule:
    - cron: '0 7 * * *'   # täglich: USBC-Liste ist dienstags neu, Gemini arbeitet täglich wenige Bälle ab (Gratis-Kontingent)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: poppler installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: USBC-Liste laden und neue Bälle übernehmen
        run: |
          UA="Mozilla/5.0"
          URL=$(curl -sL -A "$UA" https://bowl.com/approvedballlist | grep -oE '(https://bowl\.com)?/getmedia/[A-Za-z0-9-]+/approved_balllist_CURRENT\.pdf' | head -1 || true)
          [ -z "$URL" ] && URL=/getmedia/8b570e80-761c-4486-8628-9d50d718dd60/approved_balllist_CURRENT.pdf
          case "$URL" in /*) URL="https://bowl.com$URL";; esac
          echo "Lade $URL"
          curl -fsSL -A "$UA" -o usbc.pdf "$URL"
          pdftotext -layout usbc.pdf usbc.txt
          node scripts/import-usbc.js usbc.txt 75
          node scripts/validate-balls.js
      - name: Gemini ergänzt Coverstock, Fotos, Layoutvorschläge
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/gemini-enrich.js 12
          node scripts/validate-balls.js
      - name: Produktfotos ergänzen
        continue-on-error: true
        run: |
          node scripts/find-images.js
          node scripts/validate-balls.js
      - name: Committen
        run: |
          if git diff --quiet balls.json; then echo "Nichts Neues"; exit 0; fi
          git config user.name "balls-bot"; git config user.email "balls-bot@users.noreply.github.com"
          git add balls.json
          git commit -m "Ballliste aktualisiert"
          git push
